<body>
<audio id="florestAudio" loop preload="none" src="assets/floresta.mp3"></audio>
<!--MV-TOPO-->

<section class="mv-banda">
  <img src="imagens/geral/banda-espada.jpg" alt="" aria-hidden="true">
  <div class="veu" aria-hidden="true"></div>
  <div class="txt">
    <p style="margin:0 0 6px;font-size:14px;color:#CFC9B9"><a href="index.html" style="color:#A9D46E">Início</a> / Loja</p>
    <h1>Loja</h1>
    <p>Feito à mão em Belém, em pequenas quantidades. Compra e dúvidas direto pelo WhatsApp.</p>
  </div>
</section>

<main class="mv-loja">
  <div class="loja-categorias" role="group" aria-label="Filtrar por categoria">
    <button type="button" class="cat-btn ativo" onclick="filtrarCategoria('todos', this)">Todos <span class="cat-contador" id="cnt-todos">0</span></button>
    <button type="button" class="cat-btn" onclick="filtrarCategoria('sais', this)">Sais rituais <span class="cat-contador" id="cnt-sais">0</span></button>
    <button type="button" class="cat-btn" onclick="filtrarCategoria('amuletos', this)">Amuletos <span class="cat-contador" id="cnt-amuletos">0</span></button>
    <button type="button" class="cat-btn" onclick="filtrarCategoria('plantas', this)">Plantas vivas <span class="cat-contador" id="cnt-plantas">0</span></button>
    <button type="button" class="cat-btn" onclick="filtrarCategoria('difusores', this)">Difusores <span class="cat-contador" id="cnt-difusores">0</span></button>
  </div>
  <div class="mv-grade" id="gridProdutos"><!--GRADE--></div>
</main>

<!--MV-RODAPE-->

<script src="assets/site.js"></script>
<script>
function filtrarCategoria(cat, btn) {
  document.querySelectorAll(".cat-btn").forEach(function(b){ b.classList.remove("ativo"); b.setAttribute("aria-pressed", "false"); });
  if (btn) { btn.classList.add("ativo"); btn.setAttribute("aria-pressed", "true"); }
  var visiveis = 0;
  document.querySelectorAll("#gridProdutos .mv-card").forEach(function(card) {
    var mostra = cat === "todos" || card.getAttribute("data-categoria") === cat;
    card.classList.toggle("oculto", !mostra);
    if (mostra) visiveis++;
  });
  var grid = document.getElementById("gridProdutos");
  var vazio = grid.querySelector(".cat-vazio");
  if (visiveis === 0 && !vazio) { var d = document.createElement("p"); d.className = "cat-vazio"; d.textContent = "Produtos desta categoria em breve."; grid.appendChild(d); }
  else if (visiveis > 0 && vazio) { vazio.remove(); }
}
</script>
</body>
